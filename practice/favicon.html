<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Favicon</title>
        <link rel="icon" type="image/jpg" href="../pics/bingo.jpg">
    </head>
    <body>
        <img src="../pics/bingo.jpg" height="300">
    </body>
<html>
<!--The rel attribute in HTML, short for "relationship," defines the relationship between the current document and a linked resource. It is used on elements like <link>, <a>, and <area> to provide semantic information about the nature of the link.-->
<!--Example:-->
<!--
rel="stylesheet" in a <link> tag indicates that the linked file is a CSS stylesheet for styling the page.
rel="icon" indicates the linked file is a favicon for the website.
rel="author" in an <a> tag signifies that the linked page is about the author of the current document.
-->
