<!DOCTYPE html>
<html lang="en">
    <body>
        <form action="index.php" method="POST" enctype="multipart/form-data">
            <label for="username">username:</label>
            <input type="text" id="username" placeholder="Hanabi" minilength="6" maxlength="15" ><br>

            <label for="password">password:</label>
            <input type="password" id="password" minilength="6" maxlength="15" ><br>

            <label for="email">email:</label>
            <input type="email" id="email" placeholder="Weweteabread@gmail.com" ><br>

            <label for="phone">phone #:</label>
            <input type="tel" id="phone" placeholder="077 828 256" pattern="[0]{1}[0-9]{2} [0-9]{3} [0-9]{3}"><br>

            <label for="bday">birthdate:</label>
            <input type="date" id="bday"><br>

            <label for="quantity">quantity:</label>
            <input type="number" id="quantity" min="0" max="99" value="1"><br>

            <label for="Mr.">Mr.</label>
            <input type="radio" id="Mr." value="Mr." name="title">
            <label for="Ms.">Ms.</label>
            <input type="radio" id="Ms." value="Ms" name="title">
            <label for="PhD.">PhD.</label>
            <input type="radio" id="PhD." value="PhD." name="title"><br>

            <label for="payment">payment</label>
            <select id="payment">
                <option value="visa">visa</option>
                <option value="mastercard">mastercard</option>
                <option value="giftcard">giftcard</option>
            </select><br>

            <label for="subcribe">subcribe</label>
            <input type="checkbox" id="subcribe"><br>

            <label for="comment">comment</label>
            <textarea id="comment" rows="5" cols="30"></textarea><br>

            <label for="file">file:</label>
            <input type="file" id="file" accept="image/png, image/jpeg"><br>

            <input type="reset"><br>
            <input type="submit">
        </form>
    </body>
</html>
