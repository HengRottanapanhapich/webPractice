<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Pseudo classes</title>
        <link rel="stylesheet" href="pseudo_classes.css">
    </head>
    <body>
        <a id="chiikawa1" href="https://www.pinterest.com/pin/136233957474914917/">chiikawa</a>
        <a id="chiikawa2" href="https://www.pinterest.com/pin/136233957474914917/">chiikawa</a>
        <a id="chiikawa3" href="https://www.pinterest.com/pin/136233957474914917/">chiikawa</a>
        <ul>
            <li>This is number1</li>
            <li>This is number2</li>
            <li>This is number3</li>
            <li>This is number4</li>
            <li>This is number5</li>
            <li>This is number6</li>
            <li>This is number7</li>
            <li>This is number8</li>
            <li>This is number9</li>
            <li>This is number10</li>
        </ul>

        <div id="hi">Hover here
            <p>Hello there :D</p>
        </div>
    </body>
</html>
<!-- Pseudo-class: they are keywords ( like hover active...) added to a selector ( like button and other stuff..) they modify the behavior of an element when they are in a certain state. -->
